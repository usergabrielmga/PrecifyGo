
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orçamento</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      color: #333;
      margin: 40px;
      background: #fff;
    }

    .document {
      max-width: 850px;
      margin: 0 auto;
    }

    /* CABEÇALHO */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 0.5px solid #ddd;
    }

    .header-content {
      min-width: 0;
      flex: 1;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #222;
    }

    .subtitle {
      margin-top: 5px;
      font-size: 11px;
      color: #888;
    }

    .logo-container {
      flex: 0 0 auto;
      width: 116px;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .issuer-logo {
      display: block;
      max-width: 116px;
      max-height: 76px;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    /* EMISSOR E CLIENTE */
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      margin-bottom: 35px;
    }

    .section {
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: #888;
      margin-bottom: 9px;
    }

    .info {
      line-height: 1.8;
      color: #666;
      font-size: 11px;
      overflow-wrap: anywhere;
    }

    .info strong {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #333;
      margin-bottom: 2px;
    }

    /* ITENS */
    .items-section {
      margin-top: 10px;
    }

    .items-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #555;
      margin-bottom: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      background: #fafafa;
      color: #777;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      padding: 10px 8px;
      text-align: left;
      font-weight: 600;
      border-bottom: 0.5px solid #ddd;
    }

    tbody td {
      padding: 12px 8px;
      border-bottom: 0.5px solid #eee;
      color: #555;
      font-size: 11px;
    }

    td.center,
    th.center {
      text-align: center;
    }

    td.right,
    th.right {
      text-align: right;
    }

    /* TOTAL */
    .total-area {
      display: flex;
      justify-content: flex-end;
      margin-top: 22px;
    }

    .total-content {
      min-width: 220px;
      text-align: right;
    }

    .total-label {
      font-size: 10px;
      color: #888;
      margin-bottom: 6px;
      letter-spacing: 0.4px;
    }

    .total-value {
      font-size: 19px;
      font-weight: 600;
      color: #222;
    }

    /* RODAPÉ */
    .footer {
      margin-top: 50px;
      padding-top: 10px;
      border-top: 0.5px solid #eee;
      text-align: center;
      color: #aaa;
      font-size: 9px;
    }

    @media print {
      body {
        margin: 25px;
      }

      .document {
        max-width: 100%;
      }

      thead {
        display: table-header-group;
      }

      tr {
        page-break-inside: avoid;
      }

      .issuer-logo {
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }
    }

    @media screen and (max-width: 600px) {
      body {
        margin: 20px;
      }

      .header {
        gap: 14px;
      }

      .logo-container {
        width: 88px;
        height: 64px;
      }

      .issuer-logo {
        max-width: 88px;
        max-height: 64px;
      }

      .info-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .header h1 {
        font-size: 20px;
      }

      thead th,
      tbody td {
        padding: 9px 5px;
      }
    }
  </style>
</head>

<body>

  <main class="document">

    <!-- CABEÇALHO -->
    <header class="header">

      <div class="header-content">
        <h1>ORÇAMENTO</h1>
        <div class="subtitle">Proposta comercial</div>
      </div>

      <div class="logo-container">
        {{emissor_logo_html}}
      </div>

    </header>

    <!-- EMISSOR E CLIENTE -->
    <section class="info-grid">

      <div class="section">
        <div class="section-title">Emissor</div>

        <div class="info">
          <strong>{{emissor_nome}}</strong>
          {{emissor_email}}<br />
          {{emissor_telefone}}
        </div>
      </div>

      <div class="section">
        <div class="section-title">Cliente</div>

        <div class="info">
          <strong>{{cliente_nome}}</strong>
          {{cliente_email}}<br />
          {{cliente_telefone}}
        </div>
      </div>

    </section>

    <!-- ITENS -->
    <section class="items-section">

      <div class="items-title">
        Itens do orçamento
      </div>

      <table>
        <thead>
          <tr>
            <th>Produto / Serviço</th>
            <th class="center">Qtd.</th>
            <th class="right">Valor unitário</th>
            <th class="right">Subtotal</th>
          </tr>
        </thead>

        <tbody>
          {{items}}
        </tbody>
      </table>

    </section>

    <!-- TOTAL -->
    <section class="total-area">

      <div class="total-content">

        <div class="total-label">
          VALOR TOTAL
        </div>

        <div class="total-value">
          R$ {{total}}
        </div>

      </div>

    </section>

  </main>

</body>
</html>
